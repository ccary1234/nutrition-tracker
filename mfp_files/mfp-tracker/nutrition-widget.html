<!-- ============================================================
     NUTRITION TRACKER WIDGET (MyFitnessPal)
     Paste into an Elementor HTML widget or WP Custom HTML block.

     ONE EDIT REQUIRED: replace YOUR_GITHUB_USERNAME and YOUR_REPO
     in the DATA_URL line inside the script below.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<div id="mfp-widget">
  <div class="mfw-board">
    <div class="mfw-head">
      <div>
        <span class="mfw-kicker">Nutrition Log</span>
        <h2 class="mfw-title">What I'm Eating</h2>
      </div>
      <nav class="mfw-tabs" aria-label="Choose chart">
        <button type="button" class="mfw-tab mfw-active" data-view="calories">Calories</button>
        <button type="button" class="mfw-tab" data-view="macros">Macros</button>
      </nav>
    </div>

    <div class="mfw-stats" id="mfw-stats"></div>

    <div class="mfw-chart-wrap">
      <canvas id="mfw-chart" height="300" role="img" aria-label="Daily nutrition chart"></canvas>
      <p class="mfw-status" id="mfw-status">Loading nutrition data…</p>
    </div>

    <div class="mfw-foot">
      <span id="mfw-updated"></span>
      <span>Logged with MyFitnessPal</span>
    </div>
  </div>
</div>

<style>
  #mfp-widget{
    --mfw-green:#17382A;
    --mfw-green-deep:#0F281D;
    --mfw-cream:#F3ECDA;
    --mfw-cream-dim:rgba(243,236,218,.62);
    --mfw-line:rgba(243,236,218,.16);
    --mfw-amber:#E8A33C;
    --mfw-protein:#7FB7A3;
    --mfw-carbs:#E8A33C;
    --mfw-fat:#C98A6B;
    font-family:'Barlow Condensed',system-ui,-apple-system,sans-serif;
    max-width:760px;margin:2rem auto;
  }
  #mfp-widget *{box-sizing:border-box;margin:0;padding:0}
  #mfp-widget .mfw-board{
    background:linear-gradient(178deg,var(--mfw-green) 0%,var(--mfw-green-deep) 100%);
    border:1px solid rgba(243,236,218,.22);border-radius:10px;
    padding:22px 22px 14px;color:var(--mfw-cream);
    box-shadow:0 10px 30px rgba(15,40,29,.35);
  }
  #mfp-widget .mfw-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--mfw-line);padding-bottom:14px;
  }
  #mfp-widget .mfw-kicker{
    display:block;font-size:12px;font-weight:600;letter-spacing:.28em;
    text-transform:uppercase;color:var(--mfw-amber);
  }
  #mfp-widget .mfw-title{
    font-size:34px;font-weight:700;line-height:1.05;text-transform:uppercase;
    letter-spacing:.02em;color:var(--mfw-cream);
  }
  #mfp-widget .mfw-tabs{display:flex;gap:6px}
  #mfp-widget .mfw-tab{
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;
    background:transparent;color:var(--mfw-cream-dim);
    border:1px solid var(--mfw-line);border-radius:4px;
    padding:5px 12px;cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  #mfp-widget .mfw-tab:hover{color:var(--mfw-cream)}
  #mfp-widget .mfw-tab:focus-visible{outline:2px solid var(--mfw-amber);outline-offset:2px}
  #mfp-widget .mfw-tab.mfw-active{
    background:var(--mfw-amber);border-color:var(--mfw-amber);color:var(--mfw-green-deep);
  }
  #mfp-widget .mfw-stats{
    display:flex;gap:26px;flex-wrap:wrap;padding:14px 2px 4px;
  }
  #mfp-widget .mfw-stat .mfw-num{
    font-size:30px;font-weight:700;color:var(--mfw-cream);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  #mfp-widget .mfw-stat .mfw-label{
    font-size:11px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mfw-cream-dim);
  }
  #mfp-widget .mfw-chart-wrap{position:relative;padding:10px 2px 4px}
  #mfp-widget .mfw-status{
    text-align:center;padding:30px 8px;font-size:16px;color:var(--mfw-cream-dim);
  }
  #mfp-widget .mfw-foot{
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-top:10px;padding-top:10px;border-top:2px solid var(--mfw-line);
    font-size:12px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mfw-cream-dim);
  }
  @media (max-width:520px){
    #mfp-widget .mfw-board{padding:16px 14px 10px}
    #mfp-widget .mfw-title{font-size:27px}
    #mfp-widget .mfw-stats{gap:18px}
    #mfp-widget .mfw-stat .mfw-num{font-size:24px}
  }
</style>

<script>
(function () {
  "use strict";

  // >>> EDIT THIS LINE ONLY <<<
  var DATA_URL = "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPO/main/data/nutrition.json";

  var DAYS_SHOWN = 30;

  var cream = "#F3ECDA", creamDim = "rgba(243,236,218,.62)",
      grid = "rgba(243,236,218,.10)", amber = "#E8A33C";

  var el = {
    stats: document.getElementById("mfw-stats"),
    status: document.getElementById("mfw-status"),
    canvas: document.getElementById("mfw-chart"),
    updated: document.getElementById("mfw-updated")
  };

  var chart = null, rows = [], view = "calories";

  document.querySelectorAll("#mfp-widget .mfw-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll("#mfp-widget .mfw-tab").forEach(function (t) {
        t.classList.remove("mfw-active");
      });
      tab.classList.add("mfw-active");
      view = tab.getAttribute("data-view");
      draw();
    });
  });

  function shortDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  function avg(values) {
    var v = values.filter(function (x) { return x != null; });
    if (!v.length) return null;
    return Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length);
  }

  function rolling7(data) {
    return data.map(function (_, i) {
      return avg(data.slice(Math.max(0, i - 6), i + 1));
    });
  }

  function renderStats() {
    var last7 = rows.slice(-7);
    var lastLogged = null;
    for (var i = rows.length - 1; i >= 0; i--) {
      if (rows[i].calories != null) { lastLogged = rows[i]; break; }
    }
    var items = [
      { num: avg(last7.map(function (r) { return r.calories; })), label: "7-Day Avg Cal" },
      { num: avg(last7.map(function (r) { return r.protein; })), label: "7-Day Avg Protein (g)" },
      { num: lastLogged ? lastLogged.calories : null, label: lastLogged ? "Last Logged (" + shortDate(lastLogged.date) + ")" : "Last Logged" }
    ];
    el.stats.innerHTML = items.map(function (s) {
      return '<div class="mfw-stat"><div class="mfw-num">' +
        (s.num != null ? s.num.toLocaleString() : "\u2014") +
        '</div><div class="mfw-label">' + s.label + "</div></div>";
    }).join("");
  }

  function baseOptions() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: creamDim, font: { family: "'Barlow Condensed', sans-serif", size: 14, weight: 600 }, boxWidth: 14 }
        },
        tooltip: {
          backgroundColor: "#0F281D", titleColor: cream, bodyColor: cream,
          borderColor: "rgba(243,236,218,.25)", borderWidth: 1
        }
      },
      scales: {
        x: {
          ticks: { color: creamDim, font: { family: "'Barlow Condensed', sans-serif", size: 12 }, maxTicksLimit: 10 },
          grid: { color: grid }, stacked: view === "macros"
        },
        y: {
          ticks: { color: creamDim, font: { family: "'Barlow Condensed', sans-serif", size: 12 } },
          grid: { color: grid }, stacked: view === "macros"
        }
      }
    };
  }

  function draw() {
    if (!rows.length) return;
    var shown = rows.slice(-DAYS_SHOWN);
    var labels = shown.map(function (r) { return shortDate(r.date); });
    var config;

    if (view === "calories") {
      var cals = shown.map(function (r) { return r.calories; });
      config = {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            { label: "Calories", data: cals, borderColor: amber, backgroundColor: "rgba(232,163,60,.15)",
              fill: true, tension: 0.3, spanGaps: false, pointRadius: 2, borderWidth: 2 },
            { label: "7-day avg", data: rolling7(cals), borderColor: cream, borderDash: [6, 5],
              pointRadius: 0, borderWidth: 2, fill: false, tension: 0.3, spanGaps: true }
          ]
        },
        options: baseOptions()
      };
    } else {
      config = {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            { label: "Protein (g)", data: shown.map(function (r) { return r.protein; }), backgroundColor: "#7FB7A3" },
            { label: "Carbs (g)", data: shown.map(function (r) { return r.carbs; }), backgroundColor: amber },
            { label: "Fat (g)", data: shown.map(function (r) { return r.fat; }), backgroundColor: "#C98A6B" }
          ]
        },
        options: baseOptions()
      };
    }

    if (chart) chart.destroy();
    chart = new Chart(el.canvas, config);
  }

  fetch(DATA_URL, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      rows = data;
      if (!rows.length) { el.status.textContent = "No data logged yet."; return; }
      el.status.style.display = "none";
      el.updated.textContent = "Through " + shortDate(rows[rows.length - 1].date);
      renderStats();
      draw();
    })
    .catch(function () {
      el.status.textContent = "Couldn\u2019t load nutrition data. Check that DATA_URL points to your repo\u2019s nutrition.json.";
    });
})();
</script>
