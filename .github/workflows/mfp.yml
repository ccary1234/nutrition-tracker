name: Fetch MyFitnessPal data

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install myfitnesspal

      - name: Fetch nutrition data
        env:
          MFP_COOKIES: ${{ secrets.MFP_COOKIES }}
        run: python fetch_mfp.py

      - name: Commit updated data
        run: |
          git config user.name "mfp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nutrition.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update nutrition data ($(date -u +%F))"
            git push
          fi
